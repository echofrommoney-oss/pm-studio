<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM 工作台</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root{
  --hue:250;
  --paper:#f4f4f7; --surface:#ffffff; --ink:#24223a; --muted:#6c6983; --faint:#9a97ad;
  --line:#e1dfe9; --line-strong:#cfccdb;
  --accent:hsl(var(--hue) 52% 40%); --accent-ink:hsl(var(--hue) 55% 28%);
  --accent-soft:hsl(var(--hue) 60% 96%); --accent-mid:hsl(var(--hue) 45% 88%);
  --ok:#2f7a55; --warn:#a8641a; --bad:#b3383b;
  --font:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.6 var(--font);color:var(--ink);background:var(--paper);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 專案識別：整個畫面唯一大膽的地方 ── */
header{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);min-height:64px}
.ident{display:flex;align-items:center;gap:14px;padding:0 22px 0 0;min-width:0}
.band{width:10px;align-self:stretch;background:var(--accent)}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;flex:none}
.pname{font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppath{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.status{margin-left:auto;display:flex;align-items:center;gap:18px;padding:0 20px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px}

main{display:grid;grid-template-columns:236px minmax(360px,440px) 1fr;min-height:0}
section{min-height:0;display:flex;flex-direction:column}

/* ── 需求清單 ── */
.reqs{border-right:1px solid var(--line);background:var(--paper)}
.reqs-head{padding:16px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.reqs-head h2{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 12px;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn.danger{color:var(--bad);border-color:#e6c3c4}
.btn:disabled{opacity:.45;cursor:not-allowed}
.newreq{display:none;padding:0 12px 12px;gap:6px}
.newreq.show{display:flex}
.newreq input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:7px;padding:5px 9px;background:var(--surface)}
.req-list{list-style:none;margin:0;padding:0 8px 16px;overflow:auto}
.req-list li button{width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;display:block}
.req-list li button:hover{background:#ebeaf1}
.req-list li button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.req-name{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-meta{display:block;font-size:12px;color:var(--faint)}
.req-meta .live{color:var(--accent)}
.empty-side{padding:6px 18px;color:var(--faint);font-size:13px}

/* ── 對話 ── */
.chat{background:var(--surface);border-right:1px solid var(--line)}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:57px}
.chat-head h2{margin:0;font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{flex:1;overflow:auto;padding:18px 18px 8px}
.msg{margin:0 0 18px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .bubble{background:var(--accent-soft);border:1px solid var(--accent-mid);border-radius:12px 12px 3px 12px;padding:9px 13px;max-width:92%;white-space:pre-wrap;word-break:break-word}
.wf{font-size:12px;color:var(--muted);margin-bottom:4px}
.msg.ai .body{word-break:break-word}
.body p{margin:0 0 .6em} .body ul,.body ol{margin:.2em 0 .7em;padding-left:1.4em} .body li{margin:.15em 0}
.body h3,.body h4{font-size:14px;margin:.9em 0 .3em} .body code{background:#f0eff5;border-radius:4px;padding:0 4px;font-size:.92em;word-break:break-all}
.meta{font-size:12px;color:var(--faint);margin-top:4px}
.meta.bad{color:var(--bad)}
details.acts{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
details.acts summary{cursor:pointer;color:var(--muted)}
.act{padding:1px 0 1px 12px;border-left:2px solid var(--line);margin-left:3px;word-break:break-all}
.act b{font-weight:600;color:var(--ink)}
.act.err{color:var(--bad);border-color:#e8c4c5}
.denied{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fdf5ec;color:var(--warn);font-size:12.5px}
.divider{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:4px 0 18px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.working{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.working .now{font-size:12.5px;color:var(--accent-ink);margin-top:6px}
.welcome{color:var(--muted);padding:26px 4px}
.welcome h3{color:var(--ink);font-size:16px;margin:0 0 6px}

.composer{border-top:1px solid var(--line);padding:12px 14px 14px;background:var(--surface)}
.wfs{margin-bottom:9px}
.wftabs{display:flex;gap:2px;margin-bottom:7px;border-bottom:1px solid var(--line)}
.wftabs button{border:0;background:none;padding:3px 9px 5px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.wftabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.wfrow{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.wfrow[hidden]{display:none}
.wfs label{position:relative}
.wfs input{position:absolute;opacity:0;pointer-events:none}
.wfs label span{display:inline-block;border:1px solid var(--line-strong);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.wfs input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.wfs input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;resize:none;border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;min-height:78px;max-height:240px;background:var(--surface);line-height:1.55}
textarea:focus{border-color:var(--accent);outline:none}
.send-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.hint{font-size:12px;color:var(--faint);flex:1}

/* ── 預覽 ── */
.preview{background:var(--paper)}
.pv-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);min-height:57px}
.pv-head select{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px;background:var(--surface)}
.pv-note{padding:8px 16px;font-size:12.5px;color:var(--warn);background:#fdf6ee;border-bottom:1px solid #f1e2cf}
.pv-body{flex:1;min-height:0;position:relative}
.pv-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pv-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.pv-empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.pv-sync{padding:9px 16px;font-size:13px;background:#fff7ed;color:#8a4b0f;border-bottom:1px solid #f3dcc0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pv-sync[hidden]{display:none}
.pv-sync b{font-weight:600}
.req-meta .warn{color:var(--warn)}
/* 右欄分頁 */
.pv-tabs{display:flex;gap:2px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.pv-tabs button{border:0;background:none;padding:9px 12px 8px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.pv-tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tabpane{flex:1;min-height:0;display:flex;flex-direction:column}
.tabpane[hidden]{display:none}
.pill{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.pill:hover{border-color:var(--accent)}
/* 後端分頁 */
.be-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.be-top select{border:1px solid var(--line-strong);border-radius:7px;padding:3px 6px;background:var(--surface);max-width:240px}
.be-top .spacer{flex:1}
.be-main{flex:1;min-height:0;display:grid;grid-template-columns:112px 1fr}
.be-nav{border-right:1px solid var(--line);background:var(--surface);padding:8px 6px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.be-nav button{border:0;background:none;text-align:left;padding:6px 9px;border-radius:7px;font-size:13px;color:var(--muted)}
.be-nav button:hover{background:#efeef4}
.be-nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.be-view{min-width:0;min-height:0;overflow:auto;position:relative}
.be-view.frame{overflow:hidden;display:flex;flex-direction:column}
.be-view.frame iframe{flex:1;border:0;width:100%;background:#fff}
.be-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.be-pad{padding:16px 18px}
.be-pad h3{font-size:14px;margin:0 0 10px}
.be-pad h3:not(:first-child){margin-top:24px}
.be-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-width:640px}
.be-card ol{margin:8px 0 0;padding-left:1.3em}.be-card li{margin:6px 0}
.be-card code,.be-pad code{background:#f0eff5;border-radius:4px;padding:1px 5px;font-size:.92em}
table.be{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface)}
table.be th{font-weight:500;color:var(--faint);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
table.be td{padding:7px 8px;border-bottom:1px solid #f0eff4;vertical-align:top;word-break:break-all}
.st-done{color:var(--ok)} .st-todo{color:var(--bad)} .st-later,.st-unknown{color:var(--faint)}
.be-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.be-form input,.be-form select,.be-form textarea{border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px;background:var(--surface);font-size:13px}
.be-form textarea,.be-pad textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-height:90px;border:1px solid var(--line-strong);border-radius:7px;padding:8px}
pre.be-out{background:#f6f5f9;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;margin:8px 0 0}
pre.be-log{margin:0;padding:12px 14px;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;color:#34324a}
.be-status{font-weight:600}
.be-status.s200{color:var(--ok)} .be-status.s400{color:var(--warn)} .be-status.s500{color:var(--bad)}
.revert{margin-left:8px}
/* 建置進度明細 */
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#f6f5fb}
tr.clickable td:first-child::before{content:"▸";color:var(--faint);margin-right:6px;display:inline-block;transition:transform .15s}
tr.clickable.open td:first-child::before{transform:rotate(90deg)}
tr.detail > td{background:#faf9fc;padding:12px 14px 16px}
.dt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dt-grid section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.dt-grid h4{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 8px}
.dt-spec{font-size:13px;line-height:1.65;overflow-x:auto}
.dt-spec h1,.dt-spec h2,.dt-spec h3,.dt-spec h4{font-size:13.5px;margin:4px 0 6px;color:var(--ink)}
.dt-spec p{margin:0 0 8px}.dt-spec ul,.dt-spec ol{margin:0 0 8px;padding-left:1.3em}
.dt-spec table,.dt-act table{border-collapse:collapse;width:100%;font-size:12.5px}
.dt-spec th,.dt-spec td,.dt-act th,.dt-act td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top;word-break:break-word}
.dt-spec th,.dt-act th{background:#f6f5f9;font-weight:600}
.dt-spec td:nth-child(-n+2),.dt-spec th:nth-child(-n+2),.dt-act td:nth-child(-n+2),.dt-act th:nth-child(-n+2){white-space:nowrap;word-break:normal}
.dt-spec code,.dt-act code{background:#f0eff5;border-radius:4px;padding:0 4px}
.dt-spec pre{background:#f6f5f9;border-radius:6px;padding:8px;overflow:auto;font-size:12px}
.dt-act tr.extra td{background:#fff6ea}
.dt-diff{margin:0 0 10px;padding:8px 10px;border-radius:8px;background:#fff7ed;color:#8a4b0f;font-size:12.5px}
.dt-diff.ok{background:#eef8f2;color:var(--ok)}
.dt-note{color:var(--muted);font-size:12.5px}
/* APP 分頁 */
.phone-wrap{flex:1;min-height:0;background:#eceaf2;overflow:hidden;position:relative}
.phone{position:absolute;left:50%;top:50%;transform-origin:center center;border:12px solid #1d1b2b;border-radius:44px;background:#fff;box-shadow:0 18px 50px rgba(20,18,40,.25);overflow:hidden}
.phone iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.desk{position:absolute;left:50%;top:50%;transform-origin:center center;border:1px solid var(--line-strong);border-radius:8px;background:#fff;box-shadow:0 10px 30px rgba(20,18,40,.15);overflow:hidden}
.desk iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.shot-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#eceaf2;padding:16px}
.shot-wrap img{max-height:100%;max-width:100%;border-radius:22px;box-shadow:0 18px 50px rgba(20,18,40,.25);background:#000}
.banner{padding:9px 20px;background:#fbeeee;color:var(--bad);font-size:13px;border-bottom:1px solid #f0d3d4}
@media (prefers-reduced-motion:no-preference){.working .now{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<header>
  <div class="ident">
    <div class="band" aria-hidden="true"></div>
    <div class="mark" id="mark" aria-hidden="true"></div>
    <div style="min-width:0">
      <div class="pname" id="pname"></div>
      <div class="ppath" id="ppath"></div>
    </div>
  </div>
  <div class="status">
    <span id="st-claude"></span>
    <span id="st-export"></span>
    <span id="st-design"></span>
    <span id="st-sb"></span>
  </div>
</header>

<main id="app">
  <section class="reqs" aria-label="需求">
    <div class="reqs-head">
      <h2>需求</h2>
      <button class="btn" id="btn-new">新增需求</button>
    </div>
    <form class="newreq" id="newreq">
      <input id="newreq-name" placeholder="例如：課後作業提醒" maxlength="60" aria-label="需求名稱">
      <button class="btn primary" type="submit">建立</button>
    </form>
    <ul class="req-list" id="req-list"></ul>
  </section>

  <section class="chat" aria-label="對話">
    <div class="chat-head">
      <h2 id="chat-title">尚未選擇需求</h2>
      <button class="btn" id="btn-reset" hidden title="讓 Claude 從頭開始，已產出的檔案不受影響">開新對話</button>
    </div>
    <div class="log" id="log"></div>
    <div class="composer">
      <div class="wfs" id="wfs" role="radiogroup" aria-label="工作流"></div>
      <textarea id="input" placeholder="描述需求，或告訴 Claude 要改哪裡" disabled></textarea>
      <div class="send-row">
        <span class="hint" id="hint">⌘ / Ctrl + Enter 送出</span>
        <button class="btn danger" id="btn-stop" hidden>停止</button>
        <button class="btn primary" id="btn-send" disabled>送出</button>
      </div>
    </div>
  </section>

  <section class="preview" aria-label="成品預覽" style="display:flex;flex-direction:column;min-height:0">
    <div class="pv-tabs" role="tablist">
      <button role="tab" data-tab="docs" aria-selected="true">文件</button>
      <button role="tab" data-tab="app" aria-selected="false" hidden>APP</button>
      <button role="tab" data-tab="svc-app" aria-selected="false" hidden>APP</button>
      <button role="tab" data-tab="svc-web" aria-selected="false" hidden>前端</button>
      <button role="tab" data-tab="backend" aria-selected="false" hidden>後端</button>
      <button role="tab" data-tab="svc-backend" aria-selected="false" hidden>後端</button>
      <button role="tab" data-tab="qa" aria-selected="false" hidden>QA</button>
      <button role="tab" data-tab="setup" aria-selected="false" hidden>開發</button>
    </div>
    <div class="tabpane" id="tab-docs">
    <div class="pv-head">
      <select id="pv-select" aria-label="選擇成品" disabled><option>還沒有成品</option></select>
      <button class="btn" id="btn-reload" disabled>重新整理</button>
      <button class="btn" id="btn-open" disabled>新分頁開啟</button>
    </div>
    <div class="pv-sync" id="pv-sync" hidden></div>
    <div class="pv-note" id="pv-note" hidden></div>
    <div class="pv-body" id="pv-body">
      <div class="pv-empty" id="pv-empty"><div><strong>成品會出現在這裡</strong>PRD、原型、流程圖產出後自動顯示。</div></div>
    </div>
    </div>
    <div class="tabpane" id="tab-app" hidden>
      <div class="be-top">
        <span>網頁預覽</span><button class="btn" id="app-web-btn">啟動</button>
        <span style="margin-left:6px">裝置</span>
        <select id="app-device" aria-label="執行裝置"><option value="">讀取中…</option></select>
        <button class="btn" id="app-dev-btn">啟動</button>
        <span class="spacer"></span>
        <button class="btn" id="app-reload" title="保留畫面狀態，套用程式修改">熱重載</button>
        <button class="btn" id="app-restart" title="從頭重新執行 APP">重新啟動</button>
      </div>
      <div class="be-main">
        <nav class="be-nav" id="app-nav" aria-label="APP 功能">
          <button data-view="preview">網頁預覽</button>
          <button data-view="device">裝置畫面</button>
          <button data-view="progress">建置進度</button>
          <button data-view="devtools">DevTools</button>
          <button data-view="logs">日誌</button>
        </nav>
        <div class="be-view" id="app-view"></div>
      </div>
    </div>
    <div class="tabpane" id="tab-svc-app" hidden></div>
    <div class="tabpane" id="tab-svc-web" hidden></div>
    <div class="tabpane" id="tab-svc-backend" hidden></div>
    <div class="tabpane" id="tab-qa" hidden></div>
    <div class="tabpane" id="tab-setup" hidden>
      <div class="be-pad"><div class="be-card">
        <strong>先決定這個產品用什麼技術</strong>
        <p>選「系統」→「系統設計」。Claude 會依產品需求提出 APP、前端、後端的技術選項和取捨，跟你討論後再寫進 <code>ARCHITECTURE.md</code>。</p>
        <p>選定之後，這裡會依你的選擇出現 APP、前端、後端分頁：Supabase、Flutter、Next.js 有專屬面板；其他技術也能在這裡啟動、預覽、看日誌、測 API。</p>
      </div></div>
    </div>
    <div class="tabpane" id="tab-backend" hidden>
      <div class="be-top">
        <label>目前身分 <select id="be-ident" aria-label="目前身分"></select></label>
        <span class="spacer"></span>
        <span id="be-summary"></span>
        <button class="btn" id="be-reset" title="依遷移檔與 seed.sql 重建本機資料庫">重置測試資料</button>
      </div>
      <div class="be-main">
        <nav class="be-nav" id="be-nav" aria-label="後端功能">
          <button data-view="progress">建置進度</button>
          <button data-view="db">資料庫</button>
          <button data-view="auth">帳號</button>
          <button data-view="mail">測試信箱</button>
          <button data-view="files">檔案</button>
          <button data-view="fn">後端函式</button>
          <button data-view="api">API 測試</button>
          <button data-view="logs">日誌</button>
        </nav>
        <div class="be-view" id="be-view"></div>
      </div>
    </div>
  </section>
</main>

<script>
const BOOT = /*__BOOT__*/null;
const $ = s => document.querySelector(s);
const S = {req:null, reqData:null, state:null, run:null, es:null, live:null, artifacts:[], selected:null, poll:null};

/* ── 專案識別 ── */
document.documentElement.style.setProperty('--hue', BOOT.hue);
document.title = BOOT.project + ' · PM 工作台';
$('#pname').textContent = BOOT.project;
$('#ppath').textContent = BOOT.root;
$('#mark').textContent = [...BOOT.project][0] || 'P';
(() => {
  const c = `hsl(${BOOT.hue} 52% 40%)`, ch = ([...BOOT.project][0]||'P').replace(/[<&]/g,'');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="${c}"/><text x="16" y="23" font-size="19" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">${ch}</text></svg>`;
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
})();

/* ── 工具 ── */
async function api(path, body){
  const opt = body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json','X-Console-Token':BOOT.token}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('請求失敗 ' + r.status));
  return data;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){
  const lines = String(src||'').replace(/\r/g,'').split('\n'); let html = '', list = null;
  const inline = t => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const close = () => { if (list){ html += `</${list}>`; list = null; } };
  for (const raw of lines){
    const l = raw.trimEnd();
    let m;
    if (!l.trim()){ close(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))){ close(); html += `<h4>${inline(m[1])}</h4>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))){ if (list !== 'ul'){ close(); html += '<ul>'; list='ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)、]\s+(.*)/))){ if (list !== 'ol'){ close(); html += '<ol>'; list='ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if (/^\|?[-:\s|]+\|?$/.test(l) && l.includes('-')) continue;
    close(); html += `<p>${inline(l)}</p>`;
  }
  close(); return html;
}
function ago(t){
  const s = Date.now()/1000 - t;
  if (s < 60) return '剛剛'; if (s < 3600) return Math.floor(s/60) + ' 分鐘前';
  if (s < 86400) return Math.floor(s/3600) + ' 小時前';
  const d = new Date(t*1000); return `${d.getMonth()+1}/${d.getDate()}`;
}
const dur = s => s >= 60 ? `${Math.floor(s/60)} 分 ${Math.round(s%60)} 秒` : `${Math.round(s)} 秒`;
const TOOL = {Read:'讀取',Write:'寫入',Edit:'修改',MultiEdit:'修改',Glob:'搜尋檔案',Grep:'搜尋內容',Bash:'執行',TodoWrite:'整理待辦',WebFetch:'讀網頁',WebSearch:'搜尋網路',Task:'分派子任務'};
const actLine = a => `<div class="act${a.err?' err':''}"><b>${esc(TOOL[a.name]||a.name||'')}</b> ${esc(a.summary||a.text||'')}</div>`;

/* ── 工作流選項 ── */
(() => {
  const groups = [];
  BOOT.workflows.forEach(w => { let g = groups.find(x => x.name === w.group); if (!g) groups.push(g = {name: w.group, items: []}); g.items.push(w); });
  let first = true;
  $('#wfs').innerHTML = `<div class="wftabs" role="tablist">${groups.map((g,i) => `<button type="button" role="tab" data-g="${i}" aria-selected="${i===0}">${esc(g.name)}</button>`).join('')}</div>`
    + groups.map((g,i) => `<div class="wfrow" data-g="${i}" ${i?'hidden':''}>` + g.items.map(w => {
      const html = `<label><input type="radio" name="wf" value="${esc(w.id)}" ${first?'checked':''}><span>${esc(w.label)}</span></label>`;
      first = false; return html; }).join('') + '</div>').join('');
  $('#wfs').querySelectorAll('.wftabs button').forEach(b => b.onclick = () => showGroup(b.dataset.g));
})();
function showGroup(g){
  $('#wfs').querySelectorAll('.wftabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.g === String(g)));
  $('#wfs').querySelectorAll('.wfrow').forEach(r => r.hidden = r.dataset.g !== String(g));
}
function pickWorkflow(id){
  const r = document.querySelector(`input[name=wf][value="${id}"]`);
  if (r){ r.checked = true; showGroup(r.closest('.wfrow').dataset.g); }
}

/* ── 狀態 ── */
async function refreshState(){
  try{ S.state = await api('/api/state'); }catch(e){ return; }
  const st = S.state;
  $('#st-claude').innerHTML = st.claude ? '<span class="dot ok"></span>Claude Code 已連線' : '<span class="dot bad"></span>找不到 Claude Code';
  const ex = st.export;
  $('#st-export').innerHTML = !ex.installed ? '<span class="dot"></span>未安裝匯出服務'
    : ex.alive ? '<span class="dot ok"></span>匯出服務運作中'
    : ex.starting ? '<span class="dot warn"></span>匯出服務啟動中…'
    : '<span class="dot warn"></span>匯出服務未啟動 <button class="linkbtn" id="btn-export">啟動</button>';
  const b = $('#btn-export'); if (b) b.onclick = startExport;
  $('#st-design').innerHTML = !st.design_installed ? '<span class="dot"></span>未安裝設計層'
    : st.has_design_md ? '<span class="dot ok"></span>DESIGN.md 已建立'
    : '<span class="dot warn"></span>尚未定設計方向';
  renderBanner(); renderReqs();
  if (st.run && !st.run.done && (!S.run || S.run.id !== st.run.id)) attachRun(st.run);
  updateComposer();
}
function renderBanner(){
  let msg = '';
  if (S.state.code_updated) msg = '工作台已經更新，但還在跑舊版的程式：請關掉這個工作台的終端機視窗，再重新雙擊「開啟PM工作台」，新功能才會生效。';
  else if (!S.state.claude) msg = '找不到 claude 指令。請先安裝 Claude Code，並在終端機執行一次 claude 完成登入，再重新開啟工作台。';
  else if (!S.state.workflow_installed) msg = '這個專案還沒裝 studio-pm-workflow（缺 .agents/workflows/）。工作流按鈕會找不到規範檔，請先執行安裝器。';
  let el = $('#banner');
  if (!msg){ el && el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id='banner'; el.className='banner'; document.body.insertBefore(el, $('#app')); document.body.style.gridTemplateRows='auto auto 1fr'; }
  el.textContent = msg;
}
async function startExport(){
  try{ await api('/api/export/start', {}); }catch(e){ alert(e.message); }
  refreshState(); setTimeout(() => S.req && loadReq(S.req, true), 4000);
}

/* ── 需求清單 ── */
function renderReqs(){
  const reqs = S.state?.reqs || [];
  const running = S.state?.run && !S.state.run.done ? S.state.run.req : null;
  $('#req-list').innerHTML = reqs.length ? reqs.map(r => `
    <li><button data-req="${esc(r.name)}" aria-current="${r.name===S.req}">
      <span class="req-name">${esc(r.name)}</span>
      <span class="req-meta">${r.name===running ? '<span class="live">執行中</span>' : ago(r.updated)}${r.count ? ` · ${r.count} 個檔案` : ''}${r.stale ? ` · <span class="warn">${r.stale} 份待同步</span>` : ''}</span>
    </button></li>`).join('') : '<li class="empty-side">還沒有需求。按「新增需求」開始。</li>';
  $('#req-list').querySelectorAll('button').forEach(b => b.onclick = () => selectReq(b.dataset.req));
}
$('#btn-new').onclick = () => { $('#newreq').classList.toggle('show'); $('#newreq-name').focus(); };
$('#newreq').onsubmit = async e => {
  e.preventDefault();
  const name = $('#newreq-name').value.trim(); if (!name) return;
  try{ const r = await api('/api/req/create', {name}); $('#newreq-name').value=''; $('#newreq').classList.remove('show'); await refreshState(); selectReq(r.name); }
  catch(err){ alert(err.message); }
};

async function selectReq(name){
  S.req = name; S.selected = null;
  localStorage.setItem('pm-console:' + BOOT.root, name);
  renderReqs(); await loadReq(name);
}
async function loadReq(name, keepSelection){
  try{ S.reqData = await api('/api/req?name=' + encodeURIComponent(name)); }
  catch(e){ S.reqData = null; return; }
  $('#chat-title').textContent = name;
  $('#btn-reset').hidden = !S.reqData.has_session;
  renderLog(); renderArtifacts(keepSelection); renderSync(); updateComposer();
  if (typeof TAB !== 'undefined' && TAB === 'backend' && BE.view === 'progress') renderProgress();
  if (typeof TAB !== 'undefined' && TAB.startsWith('svc-') && svcState(TAB.slice(4)).view === 'progress') svcProgress(TAB.slice(4));
  if (typeof TAB !== 'undefined' && TAB === 'qa') qaRefresh(true);
}
function renderSync(){
  const el = $('#pv-sync'); const st = S.reqData?.stale || [];
  if (!st.length){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span>${st.map(x => `<b>${esc(x.label)}</b> 落後於 ${esc(x.behind.join('、'))}`).join('；')}</span><button class="btn" id="btn-sync">同步到最新</button>`;
  $('#btn-sync').onclick = () => {
    pickWorkflow('change');
    $('#input').value = '把落後的文件同步到最新：' + st.map(x => `${x.label}（落後於 ${x.behind.join('、')}）`).join('、') + '。';
    autosize(); $('#input').focus();
  };
}

/* ── 對話紀錄 ── */
function renderLog(){
  const msgs = S.reqData?.messages || [];
  let html = '';
  if (!msgs.length && !(S.live && S.live.req === S.req)){
    html = `<div class="welcome"><h3>從一句話開始</h3>
      新產品先按「設計方向」定這個產品的長相（一個問題就能開始），再選「PRD＋原型」描述需求。例如：「訂閱制的線上課程平台，學員可以收藏課程、追蹤進度，到期前一週提醒續訂。」<br><br>
      Claude 會先問幾個確認問題，你在這裡回答後，它才會開始寫。訪談逐字稿、客戶檔案這類原始材料，放進這個需求資料夾裡的「素材」即可。</div>`;
  }
  for (const m of msgs){
    if (m.role === 'divider'){ html += `<div class="divider">${esc(m.text)}</div>`; continue; }
    if (m.role === 'user'){ html += `<div class="msg user"><div class="wf">${esc(m.workflow||'')}</div><div class="bubble">${esc(m.text)}</div></div>`; continue; }
    const tools = m.tools || [];
    html += `<div class="msg ai"><div class="body">${md(m.text) || '<p class="meta">（沒有文字回覆）</p>'}</div>
      ${tools.length ? `<details class="acts"><summary>做了 ${tools.length} 個動作</summary>${tools.map(actLine).join('')}</details>` : ''}
      ${m.denials?.length ? `<div class="denied">有 ${m.denials.length} 個動作被權限擋下：${esc(m.denials.slice(0,4).join('、'))}。需要的話，把它加進 .pm-console/config.json 的 allowed_tools。</div>` : ''}
      <div class="meta${m.ok===false?' bad':''}">${m.ok===false?'未完成 · ':''}${m.seconds!=null?dur(m.seconds):''}${m.cost!=null?` · 用量約當 US$${Number(m.cost).toFixed(2)}`:''}${m.base && !m.reverted && m === msgs[msgs.length-1] ? '<button class="linkbtn revert" data-revert>退回這一輪</button>' : ''}</div></div>`;
  }
  if (S.live && S.live.req === S.req) html += liveHtml();
  const log = $('#log'); const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.innerHTML = html;
  const rv = log.querySelector('[data-revert]');
  if (rv) rv.onclick = async () => {
    if (!confirm('把這一輪的修改全部還原？\n\n會用「還原提交」抵銷這一輪的 git 提交（歷史保留），並丟棄之後尚未提交的修改與新增檔案。')) return;
    try{ const r = await api('/api/revert', {req: S.req}); await loadReq(S.req, true); if (r.touched_db) switchTab('backend'); }
    catch(e){ alert(e.message); }
  };
  if (atBottom || S.live) log.scrollTop = log.scrollHeight;
}
function liveHtml(){
  const L = S.live;
  const last = L.acts[L.acts.length-1];
  const secs = (Date.now() - L.t0)/1000;
  return `<div class="msg ai working" id="live">
    <div class="body">${L.texts.length ? md(L.texts.join('\n\n')) : '<p class="meta">Claude 正在閱讀工作流與專案…</p>'}</div>
    ${L.acts.length ? `<details class="acts"><summary>已做 ${L.acts.length} 個動作</summary>${L.acts.map(actLine).join('')}</details>` : ''}
    <div class="now">${last ? `${esc(TOOL[last.name]||last.name||'')} ${esc(last.summary||last.text||'')}` : '準備中'} · ${dur(secs)}</div></div>`;
}

/* ── 執行 ── */
function attachRun(run){
  S.run = run;
  S.live = {req: run.req, texts: [], acts: [], t0: Date.now()};
  if (S.es) S.es.close();
  const es = new EventSource(`/api/stream?run=${run.id}&from=0&token=${encodeURIComponent(BOOT.token)}`);
  S.es = es;
  let fileTimer = null;
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    const L = S.live; if (!L) return;
    if (ev.t === 'text') L.texts.push(ev.text);
    else if (ev.t === 'tool') L.acts.push({name: ev.name, summary: ev.summary});
    else if (ev.t === 'tool_error') L.acts.push({name: '錯誤', text: ev.text, err: true});
    else if (ev.t === 'file' && run.req === S.req){ clearTimeout(fileTimer); fileTimer = setTimeout(() => loadReq(S.req, true), 1200); }
    else if (ev.t === 'end'){ es.close(); finishRun(); return; }
    if (run.req === S.req) renderLog();
  };
  es.onerror = () => { if (es.readyState === 2) finishRun(); };
  clearInterval(S.poll);
  S.poll = setInterval(() => { if (S.live && S.live.req === S.req){ const n = document.querySelector('#live .now'); if (n) n.textContent = n.textContent.replace(/·[^·]*$/, '· ' + dur((Date.now()-S.live.t0)/1000)); } }, 1000);
  updateComposer();
}
async function finishRun(){
  clearInterval(S.poll);
  if (typeof loadStack === 'function') loadStack().then(() => { if (TAB === 'setup' && (STACK?.services || []).length) switchTab(firstDevTab()); });
  const req = S.run?.req; S.run = null; S.live = null; S.es = null;
  await refreshState();
  if (req && req === S.req) await loadReq(req, true);
  updateComposer();
}
function updateComposer(){
  const busy = S.state?.run && !S.state.run.done || !!S.live;
  const otherBusy = busy && S.live && S.live.req !== S.req;
  const can = !!S.req && !busy && S.state?.claude;
  $('#input').disabled = !S.req || !S.state?.claude;
  $('#btn-send').disabled = !can;
  $('#btn-stop').hidden = !(busy && !otherBusy);
  $('#hint').textContent = !S.req ? '先在左邊選一個需求' : otherBusy ? `「${S.live.req}」執行中，結束後才能送出` : busy ? 'Claude 正在處理，可以先打下一則' : '⌘ / Ctrl + Enter 送出';
}
async function send(){
  const message = $('#input').value.trim();
  if (!message || !S.req || $('#btn-send').disabled) return;
  const workflow = document.querySelector('input[name=wf]:checked').value;
  $('#btn-send').disabled = true;
  try{
    const r = await api('/api/run', {req: S.req, workflow, message});
    $('#input').value = ''; autosize();
    await loadReq(S.req, true);
    S.state.run = {id: r.run, req: S.req, done: false};
    attachRun({id: r.run, req: S.req});
    renderReqs(); renderLog();
  }catch(e){ alert(e.message); updateComposer(); }
}
$('#btn-send').onclick = send;
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); send(); } });
function autosize(){ const t = $('#input'); t.style.height='auto'; t.style.height = Math.min(240, Math.max(78, t.scrollHeight+2)) + 'px'; }
$('#input').addEventListener('input', autosize);
$('#btn-stop').onclick = async () => { if (confirm('停止這次執行？已寫入的檔案會保留。')) await api('/api/stop', {}).catch(e => alert(e.message)); };
$('#btn-reset').onclick = async () => {
  if (!confirm('開新對話後，Claude 不會記得這個需求之前談過的內容（檔案都保留）。確定嗎？')) return;
  await api('/api/req/reset', {name: S.req}).catch(e => alert(e.message)); loadReq(S.req, true);
};

/* ── 成品預覽 ── */
const GROUP = {'設計':'設計系統'};
function renderArtifacts(keep){
  const items = S.reqData?.artifacts || [];
  const sel = $('#pv-select');
  const prev = keep ? S.selected : null;
  S.artifacts = items;
  if (!items.length){
    sel.innerHTML = '<option>還沒有成品</option>'; sel.disabled = true;
    $('#btn-reload').disabled = $('#btn-open').disabled = true;
    showFrame(null); return;
  }
  const groups = {};
  items.forEach((it,i) => (groups[it.group] ||= []).push([it,i]));
  sel.innerHTML = Object.entries(groups).map(([g, list]) =>
    `<optgroup label="${esc(GROUP[g]||g)}">${list.map(([it,i]) => `<option value="${i}">${esc(it.name)}</option>`).join('')}</optgroup>`).join('');
  sel.disabled = false; $('#btn-reload').disabled = $('#btn-open').disabled = false;
  let idx = prev ? items.findIndex(it => it.rel === prev) : -1;
  if (idx >= 0 && items[idx].group === '設計' && items.some(it => it.kind === 'html')) idx = -1; // 新原型出現時從設計檔切到原型
  if (idx < 0){ idx = items.findIndex(it => it.group === '需求文件' && it.kind === 'html'); }
  if (idx < 0){ idx = items.findIndex(it => it.kind === 'html'); }
  if (idx < 0) idx = 0;
  sel.value = String(idx);
  showFrame(items[idx], prev === items[idx].rel);
}
function showFrame(it, sameAsBefore){
  const body = $('#pv-body');
  const note = $('#pv-note');
  if (!it){ body.innerHTML = `<div class="pv-empty"><div><strong>${S.req ? '這個需求還沒有成品' : '成品會出現在這裡'}</strong>PRD、原型、流程圖產出後自動顯示。</div></div>`; note.hidden = true; S.selected = null; return; }
  const ex = S.state?.export;
  note.hidden = !(it.kind === 'html' && ex?.installed && !ex.alive);
  note.innerHTML = '匯出服務沒在運作：可以預覽，但截圖匯出、一鍵複製全文、編輯後存檔不能用。 <button class="linkbtn" id="btn-export2">啟動匯出服務</button>';
  const b = $('#btn-export2'); if (b) b.onclick = startExport;
  let frame = body.querySelector('iframe');
  const src = it.full + (it.full.includes('?') ? '&' : '?') + 't=' + Math.round(it.mtime);
  if (!frame){ body.innerHTML = ''; frame = document.createElement('iframe'); frame.title = '成品預覽'; body.appendChild(frame); }
  if (!(sameAsBefore && frame.dataset.src === src)){ frame.src = src; frame.dataset.src = src; }
  S.selected = it.rel;
}
$('#pv-select').onchange = e => showFrame(S.artifacts[+e.target.value]);
$('#btn-reload').onclick = () => { const f = $('#pv-body iframe'); if (f){ f.src = f.dataset.src.replace(/t=\d+/, 't=' + Date.now()); } };
$('#btn-open').onclick = () => { const it = S.artifacts.find(a => a.rel === S.selected); if (it) window.open(it.full, '_blank', 'noopener'); };

/* ── 右欄分頁 ── */
let TAB = 'docs';
function switchTab(tab){
  TAB = tab;
  document.querySelectorAll('.pv-tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  document.querySelectorAll('.tabpane').forEach(p => p.hidden = p.id !== 'tab-' + tab);
  if (tab === 'backend') beRefresh(true);
  if (tab === 'app') appRefresh(true, true);
  if (tab.startsWith('svc-')) loadStack().then(() => renderSvc(tab.slice(4)));
  if (tab === 'qa') qaRefresh(true);
  if (tab === 'setup') loadStack().then(() => { if ((STACK?.services || []).length) switchTab(firstDevTab()); });
}
document.querySelectorAll('.pv-tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ── 後端 ── */
const BE = {view: 'progress', st: null, logFrom: {supabase: 0, api: 0}, logs: [], catalog: null, apiOut: null, fnOut: {}};
async function beRefresh(render){
  if (STACK && !(STACK.services || []).some(x => x.adapter === 'supabase')) return;
  try{ BE.st = await api('/api/dev/state'); }catch(e){ return; }
  renderSbPill();
  if (TAB === 'backend' && render) renderBackend();

function renderAppTop(){
  const web = appRun('web'), dev = appRun('device');
  const wb = $('#app-web-btn'); wb.textContent = isLive(web) ? (web.state === 'starting' ? '啟動中…（按一下停止）' : '停止') : '啟動';
  const db = $('#app-dev-btn'); db.textContent = isLive(dev) ? (dev.state === 'starting' ? '啟動中…（按一下停止）' : '停止') : '啟動';

  if (cur && [...sel.options].some(o => o.value === cur)) sel.value = cur;

  if (a.type === 'columns') return (a.caption ? `<p class="dt-note">${esc(a.caption)}</p>` : '') + fieldsTable(a.columns, d.diff?.actual_only) + (d.actual_note ? `<p class="dt-note" style="margin-top:6px">${esc(d.actual_note)}</p>` : '');
  if (a.type === 'operation') return `<p style="margin:0 0 8px"><code>${esc(a.method)} ${esc(a.path)}</code>${a.summary ? ' — ' + esc(a.summary) : ''}<br><span class="dt-note">取自「${esc(a.service)}」的 OpenAPI</span></p>
    ${a.params.length ? `<p class="dt-note">參數</p><table><thead><tr><th>名稱</th><th>位置</th><th>必填</th><th>型別</th></tr></thead><tbody>${a.params.map(x => `<tr><td><code>${esc(x.name)}</code></td><td>${esc(x.in)}</td><td>${x.required ? '是' : ''}</td><td>${esc(x.type)}</td></tr>`).join('')}</tbody></table>` : ''}
    ${a.body ? `<p class="dt-note" style="margin-top:8px">請求內容</p>${fieldsTable(a.body)}` : ''}
    ${a.responses.length ? `<p class="dt-note" style="margin-top:8px">回應</p>${a.responses.map(r => `<div style="margin-bottom:6px"><strong>${esc(r.code)}</strong> ${esc(r.description)}${r.fields.length ? fieldsTable(r.fields) : ''}</div>`).join('')}` : ''}`;
  return '';
}
function detailHtml(d){
  let diff = '';
  if (d.diff){
    const a = d.diff.spec_only, b = d.diff.actual_only;
    diff = (a.length || b.length)
      ? `<div class="dt-diff">${a.length ? `規格有、實作還沒有：<code>${a.map(esc).join('</code>、<code>')}</code>` : ''}${a.length && b.length ? '<br>' : ''}${b.length ? `實作有、規格沒寫：<code>${b.map(esc).join('</code>、<code>')}</code>（表格中以淡橘色標示）` : ''}</div>`
      : '<div class="dt-diff ok">欄位和技術規格一致。</div>';
  }
  return `${diff}<div class="dt-grid">
    <section><h4>技術規格</h4><div class="dt-spec">${d.spec_found ? d.spec_html : `<p class="dt-note">${esc(d.spec_note || '')}</p>`}</div></section>
    <section><h4>目前實作</h4><div class="dt-act">${actualHtml(d)}</div></section></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${d.try ? `<button class="btn" data-try='${esc(JSON.stringify(d.try))}'>在 API 測試台試試</button>` : ''}
      <a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="/progress?req=${encodeURIComponent(S.req)}${d.try ? '&test=1' : ''}#${encodeURIComponent(d.kind + ':' + d.name)}">在新分頁檢視與測試</a></div>`;
}
function bindFullPage(container){
  container.querySelectorAll('[data-fullpage]').forEach(b => b.onclick = () => window.open('/progress?req=' + encodeURIComponent(S.req), '_blank', 'noopener'));
}
function bindDetailRows(container){
  bindFullPage(container);
  container.querySelectorAll('tr.clickable').forEach(tr => {
    const toggle = async () => {
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('detail')){ next.remove(); tr.classList.remove('open'); return; }
      tr.classList.add('open');
      const cols = tr.children.length;
      const row = document.createElement('tr'); row.className = 'detail';
      row.innerHTML = `<td colspan="${cols}"><span class="dt-note">讀取中…</span></td>`;
      tr.after(row);
      try{
        const d = await api(`/api/detail?req=${encodeURIComponent(S.req)}&kind=${encodeURIComponent(tr.dataset.dkind)}&name=${encodeURIComponent(tr.dataset.dname)}`);
        row.firstElementChild.innerHTML = detailHtml(d);
        const t = row.querySelector('[data-try]');
        if (t) t.onclick = e => { e.stopPropagation(); tryInApi(JSON.parse(t.dataset.try)); };
      }catch(e){ row.firstElementChild.innerHTML = `<span class="st-todo">${esc(e.message)}</span>`; }
    };
    tr.onclick = toggle;
    tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  });
}
function tryInApi(t){
  if (t.target === 'supabase'){
    BE.apiOut = {method: t.method, path: t.path, body: t.body || ''}; BE.view = 'api';
    switchTab('backend'); return;
  }
  const st = svcState('backend'); st.sid = t.target; st.view = 'api'; st.apiOut = {method: t.method, path: t.path, body: '', headers: '', needExample: true};
  switchTab('svc-backend');
}

/* ── 啟動 ── */
(async () => {
  await refreshState();
  const saved = localStorage.getItem('pm-console:' + BOOT.root);
  const reqs = S.state?.reqs || [];
  const pick = S.state?.run && !S.state.run.done ? S.state.run.req : (reqs.find(r => r.name === saved) ? saved : reqs[0]?.name);
  if (pick) selectReq(pick);
  await loadStack();
  beRefresh(false);
  if ((STACK?.services || []).some(s => s.adapter === 'flutter')) appRefresh(false, true);
  setInterval(() => { if (!S.live) refreshState(); }, 8000);
})();
</script>
